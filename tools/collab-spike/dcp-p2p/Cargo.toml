[package]
name = "dcp-p2p"
description = "DCP draft-1 peer-to-peer binding (iroh + p2panda), Spike C of RFC-0004."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
# Tests that run a relay server in-process (pulls in iroh's relay server).
relay-test = ["iroh/test-utils", "dep:iroh-relay"]

[dependencies]
dcp-core = { path = "../dcp-core" }
async-trait.workspace = true
base64.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "net", "io-util", "sync", "time", "macros", "rt-multi-thread"] }

# p2panda 0.7.1 (crates.io, 2026-08-21): the pieces the binding really uses.
p2panda-core = "=0.7.1"
p2panda-store = { version = "=0.7.1", default-features = false, features = ["sqlite", "spaces"] }
p2panda-sync = "=0.7.1"
p2panda-auth = { version = "=0.7.1", default-features = false, features = ["serde"] }
p2panda-encryption = { version = "=0.7.1", default-features = false, features = ["data_scheme"] }
p2panda-spaces = "=0.7.1"
petgraph = "0.8"
serde_bytes = "0.11"

# iroh 1.x transport and blobs. iroh-blobs 0.103.1 is the fixed release (0.103.0 is yanked:
# push-request bug, https://www.iroh.computer/blog/iroh-blobs-push-fix).
iroh = { version = "1.4", default-features = false, features = ["tls-ring"] }
iroh-blobs = "=0.103.1"
iroh-relay = { version = "1", optional = true }

# Wire framing for the sync sessions (the same codec p2panda-net uses, copied: see codec.rs).
tokio-util = { version = "0.7", features = ["codec"] }
postcard = { version = "1", default-features = false, features = ["alloc", "use-std"] }
futures-util = { version = "0.3", features = ["sink"] }
bytes = "1"
tracing = "0.1"

[dev-dependencies]
dcp-conformance = { path = "../dcp-conformance" }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }
