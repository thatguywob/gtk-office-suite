name: collab-spike-f

# RFC-0004 spike F: the verification gaps spikes A, D and the first interop run
# left, on a real Synapse (relaxed AND default rate limits) and a real Collabora.
# Branch-only (spike/collab-f): the integration step decides what becomes a
# required check. Results: docs/rfc/0004-spike-f-results.md.
#
#   interop      dcp-interop's conformance journeys and cross-binding checks on
#                both Synapse profiles (matrix: profile x suite); the negative
#                controls on relaxed only
#   lease-race   lease rule 3's two-read rule, 200 forced races, both profiles
#   wopi-sim     dcp-wopi's own tests (the PutFile-on-a-conflicted-document fix)
#   churn        a 3-minute scripted Collabora session through
#                WopiHost<MatrixStore> on the default profile, with Collabora's
#                own timers and with tightened ones; events counted per minute
#
# A test that needs a service FAILS when it is missing; only DCP_SKIP_SYNAPSE=1 /
# DCP_SKIP_COLLABORA=1 skip it, and the test says so.
on:
  push:
    branches: [spike/collab-f]
    paths:
      - 'tools/collab-spike/**'
      - '.github/workflows/collab-spike-f.yml'
  workflow_dispatch:

concurrency:
  group: collab-spike-f-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  CARGO_INCREMENTAL: 0
  SYNAPSE_IMAGE: docker.io/matrixdotorg/synapse:latest

permissions:
  contents: read

jobs:
  interop:
    name: interop ${{ matrix.tag }} / ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - { tag: relaxed,         profile: relaxed, drain: '',  suite: conformance,   tests: '--test conformance',     threads: 2 }
          - { tag: relaxed,         profile: relaxed, drain: '',  suite: cross_binding, tests: '--test cross_binding',   threads: 2 }
          - { tag: relaxed,         profile: relaxed, drain: '',  suite: controls,      tests: '--test negative_control', threads: 2 }
          - { tag: default,         profile: default, drain: '',  suite: conformance,   tests: '--test conformance',     threads: 4 }
          - { tag: default,         profile: default, drain: '',  suite: cross_binding, tests: '--test cross_binding',   threads: 4 }
          # Every principal's message budget spent first: each event is then paced by the homeserver.
          - { tag: default-drained, profile: default, drain: '1', suite: conformance,   tests: '--test conformance',     threads: 6 }
          - { tag: default-drained, profile: default, drain: '1', suite: cross_binding, tests: '--test cross_binding',   threads: 6 }
    defaults:
      run:
        working-directory: tools/collab-spike
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: tools/collab-spike
          shared-key: collab-spike-f
      - name: Output directory
        run: mkdir -p "$GITHUB_WORKSPACE/out"
      - name: Build tests
        run: |
          rustc --version
          cargo test -p dcp-interop --no-run --locked
      - name: ${{ matrix.suite }} on Synapse (${{ matrix.tag }})
        env:
          DCP_MEASURE_OUT: ${{ github.workspace }}/out/${{ matrix.tag }}-${{ matrix.suite }}.jsonl
          DCP_DRAIN_BURST: ${{ matrix.drain }}
        run: |
          set -euo pipefail
          eval "$(scripts/synapse-up.sh ${{ matrix.profile }})"
          trap 'docker logs "$DCP_SYNAPSE_CONTAINER" > "$GITHUB_WORKSPACE/out/synapse-${{ matrix.tag }}-${{ matrix.suite }}.log" 2>&1 || true; scripts/synapse-down.sh ${{ matrix.profile }}' EXIT
          echo "Synapse $DCP_SYNAPSE_VERSION, profile $DCP_SYNAPSE_PROFILE, image $DCP_SYNAPSE_IMAGE_ID"
          cargo test -p dcp-interop --locked --no-fail-fast ${{ matrix.tests }} -- --nocapture --test-threads=${{ matrix.threads }} 2>&1 | tee "$GITHUB_WORKSPACE/out/${{ matrix.tag }}-${{ matrix.suite }}.log"
      - name: Timings
        if: ${{ !cancelled() }}
        run: grep -h "^TIMING" "$GITHUB_WORKSPACE/out/${{ matrix.tag }}-${{ matrix.suite }}.log" | sort -k2,3 || true
      - name: Upload
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: interop-${{ matrix.tag }}-${{ matrix.suite }}
          path: out/
          if-no-files-found: warn

  lease-race:
    name: lease race (${{ matrix.profile }}, 200 rounds)
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        profile: [relaxed, default]
    defaults:
      run:
        working-directory: tools/collab-spike
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: tools/collab-spike
          shared-key: collab-spike-f
      - name: Output directory
        run: mkdir -p "$GITHUB_WORKSPACE/out"
      - name: Build tests
        run: cargo test -p dcp-interop --test lease_race --no-run --locked
      - name: Fails loudly without a Synapse
        run: |
          if env -u DCP_SYNAPSE_URL -u DCP_SKIP_SYNAPSE cargo test -p dcp-interop --locked --test lease_race -- --nocapture > "$RUNNER_TEMP/nosyn.log" 2>&1; then
            cat "$RUNNER_TEMP/nosyn.log"
            echo "::error::lease_race passed with no Synapse"
            exit 1
          fi
          grep -q "DCP_SYNAPSE_URL is not set" "$RUNNER_TEMP/nosyn.log"
      - name: 200 forced races (and the tolerance probe) on Synapse (${{ matrix.profile }})
        env:
          DCP_RACE_ROUNDS: '200'
          DCP_MEASURE_OUT: ${{ github.workspace }}/out/race-${{ matrix.profile }}.jsonl
        run: |
          set -euo pipefail
          eval "$(scripts/synapse-up.sh ${{ matrix.profile }})"
          trap 'docker logs "$DCP_SYNAPSE_CONTAINER" > "$GITHUB_WORKSPACE/out/synapse-race-${{ matrix.profile }}.log" 2>&1 || true; scripts/synapse-down.sh ${{ matrix.profile }}' EXIT
          echo "Synapse $DCP_SYNAPSE_VERSION, profile $DCP_SYNAPSE_PROFILE, image $DCP_SYNAPSE_IMAGE_ID"
          cargo test -p dcp-interop --locked --no-fail-fast --test lease_race -- --nocapture --test-threads=2 2>&1 | tee "$GITHUB_WORKSPACE/out/race-${{ matrix.profile }}.log"
      - name: Summary
        if: ${{ !cancelled() }}
        run: grep -h "^LEASE-RACE SUMMARY\|^TOLERANCE" "$GITHUB_WORKSPACE/out/race-${{ matrix.profile }}.log" || true
      - name: Upload
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lease-race-${{ matrix.profile }}
          path: out/
          if-no-files-found: warn

  wopi-sim:
    name: dcp-wopi simulator tests (PutFile on a conflicted document)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: tools/collab-spike
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: tools/collab-spike
          shared-key: collab-spike-f-wopi
      - name: Simulator tests
        run: cargo test -p dcp-wopi --locked --lib --test host_semantics --test client_store --test conformance_over_wopi -- --nocapture

  churn:
    name: Collabora session churn against Synapse's default limits
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: tools/collab-spike
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: tools/collab-spike
          shared-key: collab-spike-f
      - name: Output directory
        run: mkdir -p "$GITHUB_WORKSPACE/out"
      - name: Build the churn test
        run: cargo test -p dcp-interop --test collabora_churn --no-run --locked
      - name: Pull Collabora
        run: |
          docker pull collabora/code:latest
          docker image inspect collabora/code:latest --format 'image {{.Id}} created {{.Created}}' | tee "$GITHUB_WORKSPACE/out/collabora-image.txt"
      # Collabora's own timers: nothing but the aliasgroup and TLS-off is overridden.
      - name: Churn, Collabora's own timers (nothing overridden but TLS and the alias group)
        env:
          DCP_WOPI_HOST_PORT: '18080'
          DCP_MEASURE_OUT: ${{ github.workspace }}/out/churn.jsonl
          DCP_CHURN_LABEL: stock
          DCP_COLLABORA_WAIT_SECS: '120'
        run: |
          set -euo pipefail
          COLLABORA_LOCK_REFRESH_SECS=default ./scripts/collabora-up.sh
          echo "timers in the container's coolwsd.xml (the image has no shell, so the file is copied out):"
          docker cp dcp-collabora:/etc/coolwsd/coolwsd.xml "$RUNNER_TEMP/coolwsd.xml"
          grep -n -i "autosave\|idlesave\|refresh\|<locking" "$RUNNER_TEMP/coolwsd.xml" | tee "$GITHUB_WORKSPACE/out/collabora-stock-config.txt" || true
          docker exec dcp-collabora coolwsd --version 2>&1 | head -3 || true
          eval "$(scripts/synapse-up.sh default)"
          trap 'docker logs "$DCP_SYNAPSE_CONTAINER" > "$GITHUB_WORKSPACE/out/synapse-stock.log" 2>&1 || true; docker logs dcp-collabora > "$GITHUB_WORKSPACE/out/collabora-stock.log" 2>&1 || true; scripts/synapse-down.sh default' EXIT
          echo "Synapse $DCP_SYNAPSE_VERSION, profile $DCP_SYNAPSE_PROFILE, image $DCP_SYNAPSE_IMAGE_ID"
          free -m
          cargo test -p dcp-interop --locked --test collabora_churn -- --nocapture --test-threads=1 2>&1 | tee "$GITHUB_WORKSPACE/out/churn-stock.log"
      # What a deployment that wants saves to be frequent might configure.
      - name: Churn, tightened timers (autosave 30 s, idle save 10 s, lock refresh 60 s as configured)
        if: ${{ !cancelled() }}
        env:
          DCP_WOPI_HOST_PORT: '18080'
          DCP_MEASURE_OUT: ${{ github.workspace }}/out/churn.jsonl
          DCP_CHURN_LABEL: tight
          DCP_COLLABORA_WAIT_SECS: '120'
          COLLABORA_LOCK_REFRESH_SECS: '60'
          COLLABORA_EXTRA_PARAMS: '--o:per_document.autosave_duration_secs=30 --o:per_document.idlesave_duration_secs=10'
        run: |
          set -euo pipefail
          ./scripts/collabora-up.sh
          eval "$(scripts/synapse-up.sh default)"
          trap 'docker logs "$DCP_SYNAPSE_CONTAINER" > "$GITHUB_WORKSPACE/out/synapse-tight.log" 2>&1 || true; docker logs dcp-collabora > "$GITHUB_WORKSPACE/out/collabora-tight.log" 2>&1 || true; scripts/synapse-down.sh default' EXIT
          echo "Synapse $DCP_SYNAPSE_VERSION, profile $DCP_SYNAPSE_PROFILE, image $DCP_SYNAPSE_IMAGE_ID"
          cargo test -p dcp-interop --locked --test collabora_churn -- --nocapture --test-threads=1 2>&1 | tee "$GITHUB_WORKSPACE/out/churn-tight.log"
      # Far beyond Collabora's own timers, to find where the limit bites. Measured, not required to finish cleanly.
      - name: Churn, aggressive timers (autosave 5 s, idle save 3 s, lock refresh 10 s), stress mode
        if: ${{ !cancelled() }}
        env:
          DCP_WOPI_HOST_PORT: '18080'
          DCP_MEASURE_OUT: ${{ github.workspace }}/out/churn.jsonl
          DCP_CHURN_LABEL: aggressive
          DCP_CHURN_STRESS: '1'
          DCP_COLLABORA_WAIT_SECS: '120'
          COLLABORA_LOCK_REFRESH_SECS: '10'
          COLLABORA_EXTRA_PARAMS: '--o:per_document.autosave_duration_secs=5 --o:per_document.idlesave_duration_secs=3'
        run: |
          set -euo pipefail
          ./scripts/collabora-up.sh
          eval "$(scripts/synapse-up.sh default)"
          trap 'docker logs "$DCP_SYNAPSE_CONTAINER" > "$GITHUB_WORKSPACE/out/synapse-aggressive.log" 2>&1 || true; docker logs dcp-collabora > "$GITHUB_WORKSPACE/out/collabora-aggressive.log" 2>&1 || true; scripts/synapse-down.sh default' EXIT
          echo "Synapse $DCP_SYNAPSE_VERSION, profile $DCP_SYNAPSE_PROFILE, image $DCP_SYNAPSE_IMAGE_ID"
          cargo test -p dcp-interop --locked --test collabora_churn -- --nocapture --test-threads=1 2>&1 | tee "$GITHUB_WORKSPACE/out/churn-aggressive.log"
      - name: Summary
        if: ${{ !cancelled() }}
        run: grep -h "^CHURN" "$GITHUB_WORKSPACE"/out/churn-*.log || true
      - name: Upload
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: collabora-churn
          path: out/
          if-no-files-found: warn
