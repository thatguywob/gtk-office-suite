name: collab-spike-c

# RFC-0004 spike C: the DCP peer-to-peer binding (iroh + p2panda), crate dcp-p2p. Runs only on the
# spike branch and by hand; the conformance policy for pull requests is dealt with at integration.
#
#   check       cargo check of dcp-p2p, and the dependency tree the build resolved to
#   upstream    p2panda-net 0.7.1's own tests, built from the crates.io source against whatever iroh
#               1.x cargo resolves today (does the published stack build and pass on this toolchain?)
#   test        dcp-p2p: spec section 12 journeys through run_all, and the tests conformance cannot see
#   measure     the measurements of docs/rfc/0004-spike-c-results.md (release build)
#   relay       the connect-through-a-relay test (iroh's in-process relay server)
#
# Nothing here needs a service: every node binds 127.0.0.1 and no n0 relay or DNS is contacted.
on:
  push:
    branches: [spike/collab-c]
    paths:
      - 'tools/collab-spike/**'
      - '.github/workflows/collab-spike-c.yml'
  workflow_dispatch:

concurrency:
  group: collab-spike-c-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  CARGO_INCREMENTAL: 0

permissions:
  contents: read

jobs:
  check:
    name: cargo check -p dcp-p2p
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: tools/collab-spike/dcp-p2p
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: tools/collab-spike/dcp-p2p
          shared-key: collab-spike-c
      - name: Versions
        run: |
          rustc --version
          cargo --version
      - name: cargo check -p dcp-p2p --all-targets
        run: cargo check -p dcp-p2p --all-targets
      - name: Resolved versions of the stack
        run: |
          mkdir -p "$GITHUB_WORKSPACE/results"
          cargo tree -p dcp-p2p --depth 1 | tee "$GITHUB_WORKSPACE/results/cargo-tree-depth1.txt"
          for c in iroh iroh-blobs iroh-base noq p2panda-core p2panda-store p2panda-sync p2panda-auth p2panda-encryption p2panda-spaces cbor-core sqlx libsqlite3-sys; do
            grep -A1 "name = \"$c\"" Cargo.lock | head -2 | tr '\n' ' '; echo
          done | tee "$GITHUB_WORKSPACE/results/resolved-versions.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: spike-c-check
          path: results/
          if-no-files-found: warn

  upstream:
    name: p2panda-net 0.7.1 upstream tests, as published
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Fetch the published crate and run its own e2e test and its sync unit tests
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/up" && cd "$RUNNER_TEMP/up"
          curl -sSfL https://static.crates.io/crates/p2panda-net/p2panda-net-0.7.1.crate | tar xz
          cd p2panda-net-0.7.1
          rustc --version | tee "$GITHUB_WORKSPACE/upstream.txt"
          # No Cargo.lock ships with the crate: cargo resolves today's newest compatible iroh.
          { cargo test --features test_utils --test e2e -- --nocapture 2>&1; echo "exit: $?"; } | tee -a "$GITHUB_WORKSPACE/upstream.txt" || true
          cargo tree -i iroh 2>&1 | head -3 | tee -a "$GITHUB_WORKSPACE/upstream.txt" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: spike-c-upstream
          path: upstream.txt
          if-no-files-found: warn

  test:
    name: dcp-p2p journeys and p2p-specific tests (debug build)
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: tools/collab-spike/dcp-p2p
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: tools/collab-spike/dcp-p2p
          shared-key: collab-spike-c-test
      - name: Output directory
        run: mkdir -p "$GITHUB_WORKSPACE/results"
      - name: Build tests
        run: cargo test --no-run
      - name: The 512-element header limit (measured)
        if: always()
        run: cargo test --test header_limit -- --nocapture --test-threads=1 2>&1 | tee "$GITHUB_WORKSPACE/results/header_limit.log"
      - name: Spec section 12 journeys through run_all, and the negative control
        if: always()
        run: |
          set -o pipefail
          cargo test --test conformance -- --nocapture --test-threads=1 2>&1 | tee "$GITHUB_WORKSPACE/results/conformance.log"
      - name: Tests conformance cannot see
        if: always()
        run: |
          set -o pipefail
          cargo test --test p2p -- --nocapture --test-threads=1 2>&1 | tee "$GITHUB_WORKSPACE/results/p2p.log"
      - name: Repeat the timing-sensitive tests ten times (the revocation tests raced twice before the fix)
        if: always()
        run: |
          fails=0
          for i in $(seq 1 10); do
            cargo test --test p2p -- content_from_a_member a_revoked_member the_blob_gate a_removed_editor --nocapture --test-threads=1 > "$GITHUB_WORKSPACE/results/repeat-$i.log" 2>&1 || fails=$((fails+1))
          done
          for i in 1 2 3; do
            cargo test --test conformance -- spec_section_12 --nocapture --test-threads=1 > "$GITHUB_WORKSPACE/results/repeat-conformance-$i.log" 2>&1 || fails=$((fails+1))
          done
          echo "failing repetitions out of 10 + 3: $fails" | tee "$GITHUB_WORKSPACE/results/repeat-summary.txt"
          test "$fails" -eq 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: spike-c-test
          path: results/
          if-no-files-found: warn

  measure:
    name: measurements (release build)
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: tools/collab-spike/dcp-p2p
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: tools/collab-spike/dcp-p2p
          shared-key: collab-spike-c-measure
      - name: Machine
        run: |
          mkdir -p "$GITHUB_WORKSPACE/results"
          { rustc --version; cargo --version; nproc; free -m; lscpu | grep 'Model name'; } | tee "$GITHUB_WORKSPACE/results/machine.txt"
      - name: Measurements
        run: |
          set -o pipefail
          cargo test --release --test measure -- --ignored --test-threads=1 --nocapture 2>&1 | tee "$GITHUB_WORKSPACE/results/measure.log"
      - name: The p2p tests again in release mode (timings of the offline and partition tests)
        if: always()
        run: |
          set -o pipefail
          cargo test --release --test p2p -- --nocapture --test-threads=1 2>&1 | tee "$GITHUB_WORKSPACE/results/p2p-release.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: spike-c-measure
          path: results/
          if-no-files-found: warn

  relay:
    name: sync through an in-process iroh relay
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    continue-on-error: true
    defaults:
      run:
        working-directory: tools/collab-spike/dcp-p2p
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: tools/collab-spike/dcp-p2p
          shared-key: collab-spike-c-relay
      - name: Relay test
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/results"
          cargo test --features relay-test --test relay -- --nocapture 2>&1 | tee "$GITHUB_WORKSPACE/results/relay.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: spike-c-relay
          path: results/
          if-no-files-found: warn

  flatpak:
    name: the same nodes inside a Flatpak build sandbox, with and without network
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    continue-on-error: true
    defaults:
      run:
        working-directory: tools/collab-spike/dcp-p2p
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: tools/collab-spike/dcp-p2p
          shared-key: collab-spike-c-test
      - name: Flatpak and the GNOME-style runtime
        run: |
          mkdir -p "$GITHUB_WORKSPACE/results"
          sudo apt-get update -qq
          sudo apt-get install -y -qq flatpak
          # Ubuntu 24.04 restricts unprivileged user namespaces, which bwrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          flatpak --version | tee "$GITHUB_WORKSPACE/results/flatpak.txt"
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08
      - name: Build the test binary
        run: |
          set -euo pipefail
          BIN=$(cargo test --test p2p --no-run --message-format=json 2>/dev/null | jq -r 'select(.profile.test==true and .target.name=="p2p") | .executable' | tail -1)
          mkdir -p "$RUNNER_TEMP/bin" && cp "$BIN" "$RUNNER_TEMP/bin/p2p"
          ls -l "$RUNNER_TEMP/bin"
      - name: Run it inside the sandbox
        run: |
          set -uo pipefail
          flatpak build-init "$RUNNER_TEMP/app" org.tunaos.P2pProbe org.freedesktop.Sdk org.freedesktop.Platform 24.08
          run() { # run <label> <flatpak build options...>
            label=$1; shift
            echo "=== $label" | tee -a "$GITHUB_WORKSPACE/results/flatpak.txt"
            flatpak build "$@" --filesystem="$RUNNER_TEMP/bin" "$RUNNER_TEMP/app" sh -c 'echo "-- interfaces seen by the sandbox:"; cat /proc/net/dev | tail -n +3 | cut -d: -f1; echo "-- test:"; '"$RUNNER_TEMP"'/bin/p2p a_peer_offline_during_publishes_catches_up_on_reconnect --nocapture --test-threads=1 2>&1 | tail -15' 2>&1 | tee -a "$GITHUB_WORKSPACE/results/flatpak.txt"
          }
          run "--unshare=network (no network permission)" --unshare=network
          run "--share=network" --share=network
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: spike-c-flatpak
          path: results/
          if-no-files-found: warn
